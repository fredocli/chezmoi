# ~/.config/fuzzel/fuzzel.ini

[main]
font=monospace:size=13                 # Font and size.
fields=name,comment,keywords           # Desktop entry fields to search.
terminal=alacritty -e                  # Terminal command for applications marked as terminal programs.
prompt="❯ "                            # Text shown as the search prompt.

width=40                               # Window width in characters, excluding margins and borders.
horizontal-pad=20                      # Horizontal padding in pixels.
vertical-pad=15                        # Vertical padding in pixels.
inner-pad=40                           # Vertical spacing between the prompt and match list, in pixels.

icon-theme=mate                         # Icon theme used for application icons.
icons-enabled=true                      # Show icons beside search results.

match-counter=true                     # Show the number of matching results.


show-actions=true                      # Include desktop entry actions in the result list.
list-executables-in-path=false         # Do not include executables from PATH in the result list.
filter-desktop=false                    # Filter desktop entries by XDG_CURRENT_DESKTOP.
match-mode=exact                        # Use exact|fzf|fuzzy  matching to find results.




[colors]
# Colors use RGBA format: RRGGBBAA; the last two digits set opacity (alpha).
background=1e1e2eee                     # Window background color.
text=cdd6f4ff                           # Search result text color.
match=f38ba8ff                          # Color of the text matching the search.
selection=313244dd                      # Background color of the selected result.
selection-text=cdd6f4ff                 # Text color of the selected result.
selection-match=1e1e2edd                # Match color in the selected result.
border=668800ff                         # Window border color.
gamma-correct-blending=true             # Use gamma-correct color blending.

[border]
width=1                                # Border width in pixels.
radius=0                               # Corner radius in pixels (0 gives square corners).
