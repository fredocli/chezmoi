# ~/.config/fuzzel/fuzzel.ini

[main]

font=monospace:size=14
fields=name,generic,comment
terminal=alacritty -e                # Skift til din foretrukne terminal (fx foot kitty, alacritty)
prompt="❯ "

width=40
horizontal-pad=20
vertical-pad=15
inner-pad=40

icon-theme=mate
icons-enabled=true

match-counter=true


show-actions=true
#launch-prefix=<none>
list-executables-in-path=false
filter-desktop=true
match-mode=fzf




[colors]
# Format: RRGGBBAA (Bemærk de sidste to tegn styrer gennemsigtighed/alpha)
background=1e1e2eee
text=cdd6f4ff
match=f38ba8ff
selection=313244dd
selection-text=cdd6f4ff
selection-match=f38ba8ff
border=668800ff
gamma-correct-blending=true

[border]
width=1
radius=0               # 10 Matcher Niris standard afrundede hjørner
