
[[mgr.prepend_keymap]]
on   = "<C-p>"
run  = 'shell --block -- printf ": "; read -r c; ya emit $c'
desc = "Run internal command"


#### NAVIGATION ####
 
# home
[[mgr.prepend_keymap]]
on   = ["g", "h"]
run  = "cd ~"
desc = "Go home"

# pictures
[[mgr.prepend_keymap]]
on =  ["g", "p"]
run =  "cd ~/Pictures"
desc = "Go to Pictures"

# music
[[mgr.prepend_keymap]]
on =  ["g", "m"]
run =  "cd ~/Music"
desc = "Go to Music"

# videos
[[mgr.prepend_keymap]]
on =  ["g", "v"]
run =  "cd ~/Videos"
desc = "Go to Videos"

# Downloads
[[mgr.prepend_keymap]]
on   = ["g", "d"]
run  = "cd ~/Downloads"
desc = "Go to downloads"

# Documents
[[mgr.prepend_keymap]]
on   = ["g", "D"]
run  = "cd ~/Documents"
desc = "Go to Documents"

# config
[[mgr.prepend_keymap]]
on   = ["g", "c"]
run  = "cd ~/.config"
desc = "Go to config"



[[mgr.prepend_keymap]]
on   = ["g", "R"]
run  = "cd ~/Remote"
desc = "Go to Remote"

# unmount ssh
[[mgr.prepend_keymap]]
on   = ["g", "u"]
run  = 'shell "bash ~/.config/yazi/scripts/sshfs-unmount" --block'
desc = "Unmount SSHFS (leave mount first)"

# mount
[[mgr.prepend_keymap]]
on  = "M"
run = "plugin mount"

[[mgr.prepend_keymap]]
on   = ["g", "<Space>"]
run  = "cd --interactive"
desc = "cd interactively"

# vim-ish enter/leave
[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter dir / open file"

[[mgr.prepend_keymap]]
on   = "h"
run  = "leave"
desc = "Parent dir"

# shell
[[mgr.prepend_keymap]]
on   = "<C-s>"
run  = 'shell "$SHELL" --block'
desc = "Shell in cwd"

[[mgr.prepend_keymap]]
on   = "!"
run  = 'shell "$SHELL" --block'
desc = "Shell in cwd"

# custom shell commands ($@ = selected files)
[[mgr.prepend_keymap]]
on   = ["c", "u"]
run  = 'shell -- printf "%s\n" "$@" | wl-copy'
desc = "Copy paths (wl-copy)"

[[mgr.prepend_keymap]]
on   = "<C-e>"
run  = 'shell -- $EDITOR "$@" --block'
desc = "Edit selected"

# fzf / zoxide
[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Jump with zoxide"

[[mgr.prepend_keymap]]
on   = "Z"
run  = "plugin fzf"
desc = "Jump with fzf"

# misc
[[mgr.prepend_keymap]]
on   = "T"
run  = "plugin toggle-pane max-preview"
desc = "Maximize preview"

[[mgr.prepend_keymap]]
on   = "<C-d>"
run  = "arrow 5"
desc = "Down 5"

[[mgr.prepend_keymap]]
on   = "<C-u>"
run  = "arrow -5"
desc = "Up 5"

# tasks
[[tasks.prepend_keymap]]
on   = "w"
run  = "close"
desc = "Close task manager"



[[mgr.prepend_keymap]]
on   = "O"
run  = "open"
desc = "Open selected files"

[[mgr.prepend_keymap]]
on   = "o"
run  = "open --interactive"
desc = "Open selected files interactively"




[[mgr.prepend_keymap]]
on   = ["g", "r"]
run  = "cd /run/media/fred"
desc = "Go to removable media"