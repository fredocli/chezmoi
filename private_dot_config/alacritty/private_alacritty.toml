[general]
live_config_reload = true
working_directory = "None"

[terminal]

[bell]
animation = "EaseOutExpo"
color = "#ffffff"
duration = 0

[colors]
draw_bold_text_with_bright_colors = true

[colors.bright]
black = "#75715e"
blue = "#66d9ef"
cyan = "#a1efe4"
green = "#a6e22e"
magenta = "#ae81ff"
red = "#f92672"
white = "#f9f8f5"
yellow = "#f4bf75"

[colors.normal]
black = "#272822"
blue = "#66d9ef"
cyan = "#a1efe4"
green = "#a6e22e"
magenta = "#ae81ff"
red = "#f92672"
white = "#f8f8f2"
yellow = "#f4bf75"

[colors.primary]
background = "#272822"
foreground = "#f8f8f2"

[colors.cursor]
text = "#272822"
cursor = "#f8f8f2"

[colors.selection]
background = "#49483e"
text = "#f8f8f2"


[colors.vi_mode_cursor]
cursor = "CellForeground"
text = "CellBackground"

[cursor]
style = "Block"
unfocused_hollow = true
vi_mode_style = "Block"

[scrolling]
history = 10000
multiplier = 6

[font]
size = 12

[font.bold]
style = "Bold"

[font.glyph_offset]
x = 0
y = 0

[font.italic]
style = "Italic"

[font.normal]
family = "Liberation Mono"
style = "Regular"

[font.offset]
x = 0
y = 0

[selection]
save_to_clipboard = true
semantic_escape_chars = ''',│`|:"' ()[]{}<>\t'''

[terminal.shell]
args = ["--login"]
program = "/bin/zsh"

[window]
dynamic_padding = false
dynamic_title = true
title = "Alacritty"

[window.class]
general = "alacritty"
instance = "alacritty"

[window.dimensions]
columns = 140
lines = 38

[window.padding]
x = 2
y = 2

[keyboard]



[[keyboard.bindings]]
action = "ToggleViMode"
key = "Insert"





